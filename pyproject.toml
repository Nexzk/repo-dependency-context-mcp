[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dependency-context-mcp"
version = "0.1.0"
description = "MVP context compiler for repository and dependency evidence retrieval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pgvector>=0.3,<1.0",
  "redis>=5.0,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.27,<1.0",
  "openai>=1.54,<2.0",
  "structlog>=24.0,<25.0",
  "python-json-logger>=2.0,<3.0",
  "tree-sitter>=0.24,<0.25",
  "tree-sitter-language-pack>=0.7,<1.0",
  "markdown-it-py>=3.0,<4.0",
  "pygments>=2.18,<3.0",
  "python-dotenv>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "rank-bm25>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "factory-boy>=3.3,<4.0",
  "faker>=37.0,<38.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.11,<2.0",
]

[project.scripts]
rdcmcp = "repo_dependency_context_mcp.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["repo_dependency_context_mcp"]
