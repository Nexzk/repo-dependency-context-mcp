name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rdcmcp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rdcmcp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RDCMCP_APP_NAME: repo-dependency-context-mcp
      RDCMCP_ENV: ci
      RDCMCP_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/rdcmcp
      RDCMCP_REDIS_URL: redis://127.0.0.1:6379/0
      RDCMCP_EMBEDDING_PROVIDER: local
      RDCMCP_RERANK_PROVIDER: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts --select F,I

      - name: Ruff Focused Phase 2 Sources
        run: >-
          ruff check
          src/repo_dependency_context_mcp/services/ingest/change_metadata.py
          src/repo_dependency_context_mcp/services/ingest/github_metadata.py
          src/repo_dependency_context_mcp/services/dependencies/vendor_docs.py
          src/repo_dependency_context_mcp/services/mcp/tools.py
          --select E,F,I,B

      - name: MyPy
        run: >-
          python -m mypy
          --ignore-missing-imports
          --follow-imports=silent
          src/repo_dependency_context_mcp/config.py
          src/repo_dependency_context_mcp/services/ingest/change_metadata.py
          src/repo_dependency_context_mcp/services/ingest/github_metadata.py
          src/repo_dependency_context_mcp/services/dependencies/vendor_docs.py
          src/repo_dependency_context_mcp/services/mcp/tools.py
          src/repo_dependency_context_mcp/services/retrieval/embedding_provider.py
          src/repo_dependency_context_mcp/services/retrieval/rerank_provider.py

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Seed demo data for smoke
        run: |
          python scripts/seed_demo.py > smoke-seed.json
          python -c "import json, os, pathlib; data = json.loads(pathlib.Path('smoke-seed.json').read_text()); pathlib.Path(os.environ['GITHUB_ENV']).write_text(f'RDCMCP_SMOKE_TENANT_ID={data[\"tenant_id\"]}\nRDCMCP_SMOKE_REPO_ID={data[\"repo_id\"]}\n', encoding='utf-8', newline='\n')"

      - name: Start API and run smoke
        shell: bash
        run: |
          python -m uvicorn repo_dependency_context_mcp.main:app --host 127.0.0.1 --port 8000 --app-dir src &
          UVICORN_PID=$!
          cleanup() {
            kill $UVICORN_PID || true
          }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz > /dev/null
          pwsh ./scripts/smoke.ps1

      - name: Run tests
        run: pytest
