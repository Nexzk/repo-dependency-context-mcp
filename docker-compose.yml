services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rdcmcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      RDCMCP_APP_NAME: repo-dependency-context-mcp
      RDCMCP_ENV: docker
      RDCMCP_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rdcmcp
      RDCMCP_REDIS_URL: redis://redis:6379/0
      RDCMCP_EMBEDDING_PROVIDER: local
      RDCMCP_RERANK_PROVIDER: local
    ports:
      - "8000:8000"
